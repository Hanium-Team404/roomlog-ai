name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.S3_REGION }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          docker pull "$IMAGE:latest"
          docker logout ghcr.io

          docker stop roomlog-ai 2>/dev/null || true
          docker rm roomlog-ai 2>/dev/null || true

          docker run -d \
            --name roomlog-ai \
            --restart always \
            --memory 24g \
            --memory-swap 28g \
            -p 8000:8000 \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e FAL_API_KEY="$FAL_API_KEY" \
            -e S3_BUCKET_NAME="$S3_BUCKET_NAME" \
            -e S3_REGION="$S3_REGION" \
            -e API_KEY="$API_KEY" \
            "$IMAGE:latest"

          docker image prune -f
